<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICT461 Course Registration</title>
    <!-- Google Fonts for professional typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Decorative background shapes for the blur effect -->
    <div class="bg-shape shape-1" aria-hidden="true"></div>
    <div class="bg-shape shape-2" aria-hidden="true"></div>

    <!-- Semantic main landmark -->
    <main class="form-container">
        <header class="form-header">
            <h1>ICT461 Registration</h1>
            <p>Please complete the form below to register for the course.</p>
        </header>

        <!-- 
          action="#" is a placeholder since there is no backend.
          novalidate disables default browser popups so we can use custom JS messages.
        -->
        <form id="registrationForm" method="post" action="#" novalidate>
            
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input 
                    type="text" 
                    id="fullName" 
                    name="fullName" 
                    required 
                    minlength="2" 
                    placeholder="e.g., Jane Doe"
                    autocomplete="name"
                    aria-describedby="nameError">
                <span class="error-message" id="nameError" role="alert">Please enter your full name (min 2 characters).</span>
            </div>

            <div class="form-group">
                <label for="studentId">Student ID</label>
                <input 
                    type="text" 
                    id="studentId" 
                    name="studentId" 
                    required 
                    pattern="[A-Za-z0-9]{5,10}" 
                    placeholder="e.g., STU12345"
                    autocomplete="off"
                    aria-describedby="idError">
                <span class="error-message" id="idError" role="alert">Student ID must be 5-10 alphanumeric characters.</span>
            </div>

            <div class="form-group">
                <label for="programme">Programme</label>
                <input 
                    type="text" 
                    id="programme" 
                    name="programme" 
                    required 
                    placeholder="e.g., BSc Computer Science"
                    autocomplete="off"
                    aria-describedby="programmeError">
                <span class="error-message" id="programmeError" role="alert">Please enter your programme.</span>
            </div>

            <div class="form-group">
                <label for="course">Course</label>
                <input 
                    type="text" 
                    id="course" 
                    name="course" 
                    required 
                    placeholder="e.g., ICT461"
                    autocomplete="off"
                    aria-describedby="courseError">
                <span class="error-message" id="courseError" role="alert">Please enter the course code.</span>
            </div>

            <button type="submit" class="submit-btn">
                <span>Register</span>
                <!-- Inline SVG for visual flair, hidden from screen readers -->
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>

        </form>
    </main>

    <script src="validation.js"></script>
</body>
</html>
