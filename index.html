<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Registration | ICT461</title>
    <!-- Google Fonts for a professional typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Link to external CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Background decorative shapes for the blur effect to interact with -->
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <main class="form-container">
        <header class="form-header">
            <h1>Course Registration</h1>
            <p>Please fill in your details to register for the upcoming semester.</p>
        </header>

        <!-- 
          action="#" is a placeholder since there is no server-side script.
          novalidate disables default browser popups so we can use custom JS messages.
        -->
        <form id="registrationForm" method="post" action="#" novalidate>
            
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <div class="input-wrapper">
                    <input type="text" id="fullName" name="fullName" required minlength="2" placeholder="e.g., Jane Doe">
                </div>
                <span class="error-message" id="nameError">Please enter your full name (min 2 characters).</span>
            </div>

            <div class="form-group">
                <label for="studentId">Student ID</label>
                <div class="input-wrapper">
                    <input type="text" id="studentId" name="studentId" required pattern="[A-Za-z0-9]{5,10}" placeholder="e.g., STU12345">
                </div>
                <span class="error-message" id="idError">Student ID must be 5-10 alphanumeric characters.</span>
            </div>

            <div class="form-group">
                <label for="programme">Programme</label>
                <div class="input-wrapper">
                    <input type="text" id="programme" name="programme" required placeholder="e.g., BSc Computer Science">
                </div>
                <span class="error-message" id="programmeError">Please enter your programme.</span>
            </div>

            <div class="form-group">
                <label for="course">Course</label>
                <div class="input-wrapper">
                    <input type="text" id="course" name="course" required placeholder="e.g., ICT461">
                </div>
                <span class="error-message" id="courseError">Please enter the course code.</span>
            </div>

            <button type="submit" class="submit-btn">
                <span>Register</span>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
            </button>

        </form>
    </main>

    <!-- Link to external JavaScript file -->
    <script src="validation.js"></script>
</body>
</html>
